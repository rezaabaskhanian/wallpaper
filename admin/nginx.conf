server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # اپلیکیشن تک‌صفحه‌ای (React Router)؛ هر مسیر ناشناخته به index.html برمی‌گردد
    # تا خودِ روتر سمت کلاینت مسیر را رسیدگی کند.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # فایل‌های هش‌دارِ Vite همیشه cache-بردار امن‌اند.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
