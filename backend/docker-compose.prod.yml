# ============================================================
# دیپلوی روی VPS — پشت Traefik موجود (پروژه‌ی آرامینا SSL/routing را
# مدیریت می‌کند؛ این فایل فقط Postgres + بک‌اند والپیپر را بالا می‌آورد).
#
# مقادیر از فایل .env کنار همین فایل خوانده می‌شوند (همون .env که از
# .env.example ساختید). traefik_net = arama_aramina_net (شبکه‌ی همون
# Traefik مشترکی که برای آرامینا بالاست؛ با `docker network ls` تأیید شد).
#
# اجرا: docker compose -f docker-compose.prod.yml up -d --build
#
# نکته: name/volume/container اینجا عمداً با پسوند _prod از docker-compose.yml
# (نسخه‌ی dev) جدا نگه داشته شدن. چون هر دو فایل تو یک پوشه‌ان، اگر اسم‌ها یکی
# بود Docker Compose اسم پروژه رو از روی پوشه می‌ساخت و ولوم/کانتینر بین dev و
# prod به‌اشتراک/تداخل پیدا می‌کرد (همون چیزی که باعث خطای auth شد).
# ============================================================
name: wallpaper-prod

services:
  postgres:
    image: postgres:15
    container_name: wallpaper_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - wallpaper_prod_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wallpaper_net

  backend:
    build:
      context: .
    container_name: wallpaper_backend_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: production
      RUN_MIGRATIONS: "true"
      LOG_LEVEL: info
      HTTP_PORT: 8090
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ARVAN_S3_ENDPOINT: ${ARVAN_S3_ENDPOINT}
      ARVAN_S3_REGION: ${ARVAN_S3_REGION}
      ARVAN_S3_BUCKET: ${ARVAN_S3_BUCKET}
      ARVAN_S3_ACCESS_KEY: ${ARVAN_S3_ACCESS_KEY}
      ARVAN_S3_SECRET_KEY: ${ARVAN_S3_SECRET_KEY}
      ARVAN_S3_USE_SSL: ${ARVAN_S3_USE_SSL}
      ARVAN_S3_PUBLIC_BASE_URL: ${ARVAN_S3_PUBLIC_BASE_URL}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wallpaper-backend.rule=Host(`api.wallpaperapp.ir`)"
      - "traefik.http.routers.wallpaper-backend.entrypoints=web"
      - "traefik.http.services.wallpaper-backend.loadbalancer.server.port=8090"
    networks:
      - wallpaper_net
      - traefik_net

volumes:
  wallpaper_prod_pg_data:

networks:
  wallpaper_net:
    driver: bridge
  traefik_net:
    external: true
    name: arama_aramina_net
